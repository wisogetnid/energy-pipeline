[tools]
python = "3.13.3"
uv = "0.7.19"

[tasks.install]
description = "Install project with dependencies using uv"
run = "uv sync --dev"

[tasks.pipeline]
description = "Run the complete energy pipeline"
run = "uv run python -m pipeline"
raw = true

[tasks.test]
description = "Run all unit tests"
run = "uv run pytest pipeline/tests"

[tasks.test-coverage]
description = "Run tests with coverage report"
run = "uv run pytest --cov=pipeline pipeline/tests --cov-report=term"

[tasks.lint]
description = "Lint code with pylint"
run = "uv run pylint pipeline"

[tasks.format]
description = "Format code with black"
run = "uv run black pipeline"

[tasks.check]
description = "Run tests and lint code"
run = [
  "uv run pytest pipeline/tests",
  "uv run pylint pipeline",
]

[tasks.clean]
description = "Clean up generated files"
run = """
find . -path ./.venv -prune -o -type d -name "__pycache__" -exec rm -rf {} +
find . -path ./.venv -prune -o -type f -name "*.pyc" -exec rm -f {} +
find . -path ./.venv -prune -o -type d -name "*.egg-info" -exec rm -rf {} +
find . -path ./.venv -prune -o -type d -name "*.egg" -exec rm -rf {} +
find . -path ./.venv -prune -o -type d -name ".pytest_cache" -exec rm -rf {} +
rm -rf .coverage
"""
